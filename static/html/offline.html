<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - File Fridge</title>
    <style>
        :root {
            --bg: #0f172a;
            --surface: rgba(255, 255, 255, 0.96);
            --border: rgba(148, 163, 184, 0.26);
            --ink: #0f172a;
            --muted: #526072;
            --brand: #0f766e;
            --brand-strong: #0f4c81;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            font-family: Inter, "Segoe UI", sans-serif;
            background:
                radial-gradient(circle at top left, rgba(14, 165, 233, 0.24), transparent 24%),
                linear-gradient(180deg, #081223 0%, var(--bg) 100%);
        }

        .offline-card {
            max-width: 32rem;
            padding: 2.5rem;
            border: 1px solid var(--border);
            border-radius: 1.75rem;
            background: var(--surface);
            box-shadow: 0 30px 80px rgba(15, 23, 42, 0.4);
            text-align: center;
        }

        .offline-icon {
            width: 5rem;
            height: 5rem;
            display: grid;
            place-items: center;
            margin: 0 auto 1rem;
            border-radius: 1.5rem;
            background: linear-gradient(135deg, rgba(15, 76, 129, 0.12), rgba(15, 118, 110, 0.14));
            color: var(--brand-strong);
            font-size: 2.2rem;
        }

        .offline-title {
            margin: 0 0 0.75rem;
            font-size: 1.8rem;
            color: var(--ink);
        }

        .offline-message {
            margin: 0 0 1.5rem;
            color: var(--muted);
            line-height: 1.6;
        }

        .offline-tips {
            margin-bottom: 1.5rem;
            padding: 1.25rem;
            border: 1px solid var(--border);
            border-radius: 1.125rem;
            background: #f8fafc;
            text-align: left;
        }

        .offline-tips h2 {
            margin: 0 0 0.85rem;
            font-size: 1rem;
            color: var(--ink);
        }

        .offline-tips ul {
            margin: 0;
            padding-left: 1rem;
            color: var(--muted);
        }

        .offline-tips li + li {
            margin-top: 0.5rem;
        }

        .retry-btn {
            border: 0;
            border-radius: 999px;
            padding: 0.85rem 1.5rem;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(135deg, var(--brand-strong) 0%, var(--brand) 100%);
            box-shadow: 0 10px 25px rgba(15, 76, 129, 0.35);
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="offline-card">
        <div class="offline-icon" aria-hidden="true">☁</div>
        <h1 class="offline-title">You're Offline</h1>
        <p class="offline-message">
            File Fridge can still show cached UI, but live file operations and fresh server data need a working connection.
        </p>

        <div class="offline-tips">
            <h2>Available while offline</h2>
            <ul>
                <li>Previously loaded pages and shell assets</li>
                <li>Cached interface styling and scripts</li>
                <li>This fallback page while connectivity is restored</li>
            </ul>
        </div>

        <button type="button" class="retry-btn" onclick="window.location.reload()">Try Again</button>
    </div>
</body>
</html>
