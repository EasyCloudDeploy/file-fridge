[project]
name = "file-fridge"
dynamic = ["version"]
description = "File cold storage management application for Linux server administrators"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "File Fridge Contributors"}
]
keywords = ["file-management", "cold-storage", "storage", "filesystem"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Archiving",
    "Topic :: System :: Filesystems",
]

dependencies = [
    "fastapi>=0.162.4",
    "uvicorn[standard]>=0.54.0",
    "sqlalchemy>=2.1.8",
    "python-multipart>=0.0.33",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "apscheduler>=3.11.3",
    "aiofiles>=25.1.0",
    "alembic>=1.20.1",
    "aiosmtplib>=5.1.3",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pyjwt>=2.15.1",
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.5.0",
    "zstandard>=0.25.0",
    "cryptography>=50.0.2",
    "email-validator>=2.3.0",
    "typing-extensions>=4.16.0",
    "libp2p>=0.8.1",
    "bcrypt>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.version]
path = "VERSION"
pattern = "(?P<version>.*)"

[project.optional-dependencies]
s3 = ["boto3>=1.44.0"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-timeout>=2.4.0",
    "black>=26.10.1",
    "ruff>=0.17.4",
    "pytest-factoryboy>=2.8.1",
    "pytest-cov>=7.1.0",
    "freezegun>=1.5.5",
    "responses>=0.26.3",
    "factory-boy>=3.3.3",
    "pytest-mock>=3.17.0",
    "respx>=0.23.1",
]

[tool.black]
line-length = 100
target-version = ['py311', 'py312']

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "DTZ", "T10", "EM", "ISC", "ICN", "PIE", "T20", "PYI", "PT", "Q", "RSE", "RET", "SIM", "ARG", "PTH", "ERA", "PD", "PGH", "PL", "TRY", "NPY", "RUF"]
ignore = ["E501"]  # Line too long (handled by black)

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
timeout = 300
markers = [
    "unit: marks tests as unit tests",
    "integration: marks tests as integration tests",
]

[tool.coverage.run]
omit = [
    "alembic/*",
    "app/main.py",
    "tests/*",
    "*/__pycache__/*",
    ".venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.debug:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == \"__main__\":",
]
ignore_errors = true
